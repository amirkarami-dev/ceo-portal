name: ceo-portal

# Full self-contained production stack for the NEW server (185.206.94.116, "same box as
# kurdvahedgas-web"). Unlike docker-compose.server.edge.yml (offline Iran box, own Traefik,
# transferred images) this server has normal internet, so images are BUILT FROM SOURCE here
# and it ATTACHES to the box's pre-existing SHARED Traefik v2.11:
#   * external network "traefik"; cert resolver "myresolver" = ACME DNS-01 via ArvanCloud.
#   * DNS-01 mints REAL Let's Encrypt certs even though the hosts sit behind the ArvanCloud
#     CDN (no inbound challenge needed). Origin therefore serves valid HTTPS on :443
#     -> set the ArvanCloud SSL mode to "Full" and origin port 443 for every host.
#   * Router/service names and container_names are unique to this platform so it never
#     disturbs kurdvahedgas-web / sms-service / v2ray on the same box.
#
#   docker compose -f deploy/docker-compose.newserver.yml --env-file deploy/.env build --no-cache
#   docker compose -f deploy/docker-compose.newserver.yml --env-file deploy/.env up -d --force-recreate

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ceo-portal-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"   # Express self-caps at ~1.4 GB buffer pool — fits the 4 GB box
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' 2>/dev/null) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [internal]

  minio:
    image: minio/minio:latest
    container_name: ceo-portal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # S3 API host — presigned report URLs are issued against this host, so it must be public.
      - "traefik.http.routers.ceoportal-s3.rule=Host(`${MINIO_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-s3.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-s3.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-s3.service=ceoportal-s3"
      - "traefik.http.services.ceoportal-s3.loadbalancer.server.port=9000"
      # Keep existing short-lived presigned URLs usable while new links use s3.myceo.ir.
      - "traefik.http.routers.ceoportal-s3-legacy.rule=Host(`${LEGACY_MINIO_DOMAIN:-s3.mabhas19.myceo.ir}`)"
      - "traefik.http.routers.ceoportal-s3-legacy.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-s3-legacy.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-s3-legacy.service=ceoportal-s3"
    networks: [internal, traefik]

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.auth
    image: ceo-portal-auth:newserver
    container_name: ceo-portal-auth
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CeoAuthDb: "Server=sqlserver,1433;Database=CeoAuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      # FarsNezam (نظام مهندسی فارس) external read-only DB — engineer auto-provisioning (empty = disabled).
      ConnectionStrings__FarsNezamDb: "${FARSNEZAM_DB_CONN:-}"
      OpenIddict__SigningCertificatePath: /certs/openiddict.pfx
      OpenIddict__SigningCertificatePassword: ${OPENIDDICT_CERT_PASSWORD}
      Sms__Provider: "${SMS_PROVIDER:-mihan}"
      Sms__MihanEndpoint: "http://www.mihansmscenter.com/webservice/index.php"
      Sms__MihanUsername: "${MIHAN_SMS_USERNAME:-}"
      Sms__MihanPassword: "${MIHAN_SMS_PASSWORD:-}"
      Sms__MihanSender: "${MIHAN_SMS_SENDER:-}"
      # Direct msgway.com sending (Sms__Provider=direct). The VPS public IP is whitelisted on msgway.
      Sms__MsgwayApiKey: "${SMS_MSGWAY_APIKEY:-}"
      Sms__MsgwayTemplateId: "${SMS_MSGWAY_TEMPLATE_ID:-13812}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Otp__LogCode: "false"
      AdminUser__Email: ${ADMIN_EMAIL}
      AdminUser__Password: ${ADMIN_PASSWORD}
      Clients__Mabhas19Web__Secret: ${MABHAS19_WEB_CLIENT_SECRET}
      Clients__Mabhas19Web__Redirect: "https://${WEB_DOMAIN}/api/auth/callback/mabhas19"
      Clients__Mabhas19Web__PostLogout: "https://${WEB_DOMAIN}"
      Clients__Mabhas19Mobile__Redirect: "mabhas19://auth"
      # plan-web is registered unconditionally by the IdP seeder (a confidential client, so it
      # requires a non-empty secret) even though plan.myceo.ir isn't hosted here.
      Clients__PlanWeb__Secret: ${PLAN_WEB_CLIENT_SECRET}
      Clients__PlanWeb__Redirect: "https://plan.myceo.ir/api/auth/callback/plan"
      # analytics-web public PKCE client (analytic.myceo.ir). Requires ANALYTICS_DOMAIN in deploy/.env;
      # the IdP seeder skips this client when its Redirect is unset (see AuthDbInitialiser.SeedClientsAsync).
      Clients__AnalyticsWeb__Redirect: "https://${ANALYTICS_DOMAIN}/auth/callback"
      Clients__AnalyticsWeb__Silent: "https://${ANALYTICS_DOMAIN}/auth/silent"
      Clients__AnalyticsWeb__PostLogout: "https://${ANALYTICS_DOMAIN}"
      # CORS: let the analytics-web SPA call the IdP discovery/JWKS/token endpoints from the browser.
      Cors__AllowedOrigins__0: "https://${ANALYTICS_DOMAIN}"
      # mun-sanandaj-web public PKCE client (mun-sanandaj.myceo.ir). Requires MUN_SANANDAJ_DOMAIN in
      # deploy/.env; the IdP seeder skips this client when its Redirect is unset.
      Clients__MunSanandajWeb__Redirect: "https://${MUN_SANANDAJ_DOMAIN}/auth/callback"
      Clients__MunSanandajWeb__Silent: "https://${MUN_SANANDAJ_DOMAIN}/auth/silent"
      Clients__MunSanandajWeb__PostLogout: "https://${MUN_SANANDAJ_DOMAIN}"
      Cors__AllowedOrigins__1: "https://${MUN_SANANDAJ_DOMAIN}"
      # landing-panel public PKCE client (landing-panel.myceo.ir) — the kurdnezam CMS admin panel.
      # Requires LANDING_PANEL_DOMAIN in deploy/.env; the IdP seeder skips it when Redirect is unset.
      Clients__LandingPanel__Redirect: "https://${LANDING_PANEL_DOMAIN}/auth/callback"
      Clients__LandingPanel__Silent: "https://${LANDING_PANEL_DOMAIN}/auth/silent"
      Clients__LandingPanel__PostLogout: "https://${LANDING_PANEL_DOMAIN}"
      Cors__AllowedOrigins__2: "https://${LANDING_PANEL_DOMAIN}"
      # admin-web public PKCE client (admin.myceo.ir) — the central user-management SPA. Requires
      # ADMIN_DOMAIN in deploy/.env; the IdP seeder skips this client when its Redirect is unset.
      Clients__AdminWeb__Redirect: "https://${ADMIN_DOMAIN}/auth/callback"
      Clients__AdminWeb__Silent: "https://${ADMIN_DOMAIN}/auth/silent"
      Clients__AdminWeb__PostLogout: "https://${ADMIN_DOMAIN}"
      # CORS: let the admin-web SPA call the IdP discovery/JWKS/token endpoints (and api/admin) from the browser.
      Cors__AllowedOrigins__3: "https://${ADMIN_DOMAIN}"
      # walfare-web public PKCE client (refahi.kurdnezam.ir) — the engineers' welfare dashboard.
      # Requires WALFARE_DOMAIN in deploy/.env; the IdP seeder skips it when Redirect is unset.
      Clients__WalfareWeb__Redirect: "https://${WALFARE_DOMAIN}/auth/callback"
      Clients__WalfareWeb__Silent: "https://${WALFARE_DOMAIN}/auth/silent"
      Clients__WalfareWeb__PostLogout: "https://${WALFARE_DOMAIN}"
      Cors__AllowedOrigins__4: "https://${WALFARE_DOMAIN}"
      # election-web public PKCE client (election.myceo.ir) — سامانه انتخابات.
      # Requires ELECTION_DOMAIN in deploy/.env; the IdP seeder skips it when Redirect is unset.
      # Its unauthenticated authorize is routed to /Account/EngineerLogin?service=election, because
      # engineer accounts have no password (see AuthorizationController.EngineerLoginClients).
      Clients__ElectionWeb__Redirect: "https://${ELECTION_DOMAIN}/auth/callback"
      Clients__ElectionWeb__Silent: "https://${ELECTION_DOMAIN}/auth/silent"
      Clients__ElectionWeb__PostLogout: "https://${ELECTION_DOMAIN}"
      Cors__AllowedOrigins__5: "https://${ELECTION_DOMAIN}"
      # room-web public PKCE client (room.myceo.ir) — جلسات آنلاین.
      # Requires ROOM_DOMAIN in deploy/.env; the IdP seeder skips it when Redirect is unset.
      # Its unauthenticated authorize is routed to /Account/EngineerLogin?service=room, for the same
      # reason as election: engineer accounts have no password.
      Clients__RoomWeb__Redirect: "https://${ROOM_DOMAIN}/auth/callback"
      Clients__RoomWeb__Silent: "https://${ROOM_DOMAIN}/auth/silent"
      Clients__RoomWeb__PostLogout: "https://${ROOM_DOMAIN}"
      Cors__AllowedOrigins__6: "https://${ROOM_DOMAIN}"
      # vms-web public PKCE client (vms.myceo.ir) — دوربین‌های نظارتی.
      # Unlike election-web and room-web this one is NOT routed to the engineer login: every route
      # in that panel is Administrator-only, so its users are staff with ordinary accounts. Sending
      # them to /Account/EngineerLogin would offer a کد ملی form they cannot satisfy.
      Clients__VmsWeb__Redirect: "https://${VMS_DOMAIN}/auth/callback"
      Clients__VmsWeb__Silent: "https://${VMS_DOMAIN}/auth/silent"
      Clients__VmsWeb__PostLogout: "https://${VMS_DOMAIN}"
      Cors__AllowedOrigins__7: "https://${VMS_DOMAIN}"
      # KurdNezam membership SQL (same server the API's mun-sanandaj sync reads) — lets the IdP
      # provision engineer logins from a کد ملی via WebS_GetEngineerInfo. Empty = disabled.
      ConnectionStrings__KurdNezamDb: "${KURDNEZAM_DB_CONN:-}"
    volumes:
      # OpenIddict token-signing PFX (generated by scripts/remote-provision.sh on first deploy).
      - ./certs:/certs:ro
      # ASP.NET Data Protection key ring. MUST survive container recreates: it encrypts the login
      # form's antiforgery token and the auth cookie, so an in-container key ring made every
      # redeploy break the next login POST. Owned by the app UID (1654) by remote-provision.sh.
      - ./authkeys:/keys
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-auth.rule=Host(`${AUTH_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-auth.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-auth.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-auth.service=ceoportal-auth"
      - "traefik.http.services.ceoportal-auth.loadbalancer.server.port=8080"
    networks: [internal, traefik]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: ceo-portal-api:newserver
    container_name: ceo-portal-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CeoDb: "Server=sqlserver,1433;Database=CeoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      # FarsNezam external read-only DB — project provisioning + typ list (empty = disabled).
      ConnectionStrings__FarsNezamDb: "${FARSNEZAM_DB_CONN:-}"
      # MinIO is reached via its public host so presigned signatures are valid for browsers.
      Minio__Endpoint: ${MINIO_DOMAIN}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__UseSSL: "true"
      # Validates JWTs issued by the central IdP (resolved via ArvanCloud -> this same box).
      Auth__Authority: "https://${AUTH_DOMAIN}"
      ExternalImport__NezamMohandesi__BaseUrl: "${NEZAM_BASE_URL:-}"
      ExternalImport__NezamMohandesi__ApiKey: "${NEZAM_API_KEY:-}"
      # Analytics: FarsNezam read-only DB. NON-EMPTY switches the analytics query engine from the
      # bundled in-memory sample data to the real SQL engine (SqlQueryEngine).
      ConnectionStrings__AnalyticsDb: "${ANALYTICS_DB_CONN:-}"
      # Analytics AI gateway (ArvanCloud, OpenAI-compatible). BaseUrl MUST end in /v1.
      AnalyticsAi__BaseUrl: "${ANALYTICS_AI_BASE_URL:-}"
      AnalyticsAi__ApiKey: "${ANALYTICS_AI_API_KEY:-}"
      AnalyticsAi__Model: "${ANALYTICS_AI_MODEL:-DeepSeek-R1-qwen-7b-awq}"
      # CORS: index 0 (https://mabhas19.myceo.ir) comes from appsettings.json; append the analytics
      # SPA origin as index 1 so the main app's origin is NOT overwritten.
      Cors__AllowedOrigins__1: "https://${ANALYTICS_DOMAIN}"
      Cors__AllowedOrigins__2: "https://${MUN_SANANDAJ_DOMAIN}"
      # kurdnezam: the CMS admin panel plus the public landing site, which calls /api/kurdnezam from
      # the browser (visit tracking + the registration/contact forms). The site is served on BOTH its
      # own root domain and the portal subdomain, so both origins must be allowed.
      Cors__AllowedOrigins__3: "https://${LANDING_PANEL_DOMAIN}"
      Cors__AllowedOrigins__4: "https://${KURDNEZAM_DOMAIN}"
      Cors__AllowedOrigins__5: "https://${KURDNEZAM_ROOT_DOMAIN}"
      # admin-web SPA (admin.myceo.ir) calls the admin API (api/admin) from the browser.
      Cors__AllowedOrigins__6: "https://${ADMIN_DOMAIN}"
      # walfare-web SPA (refahi.kurdnezam.ir) calls /api/walfare from the browser.
      Cors__AllowedOrigins__7: "https://${WALFARE_DOMAIN}"
      # election-web SPA (election.myceo.ir) calls /api/Election* from the browser.
      Cors__AllowedOrigins__8: "https://${ELECTION_DOMAIN}"
      # room-web SPA (room.myceo.ir) calls /api/Room* from the browser — including two ANONYMOUS
      # routes (the link landing page and the link join), which a guest with no account opens.
      Cors__AllowedOrigins__9: "https://${ROOM_DOMAIN}"
      # vms-web SPA (vms.myceo.ir) calls /api/VmsAdmin and /api/VmsMedia from the browser. The media
      # session route answers with a Set-Cookie the browser must keep across origins, so this entry
      # is load-bearing rather than routine — without it every camera tile fails with a 401 that
      # looks like a broken gateway.
      Cors__AllowedOrigins__10: "https://${VMS_DOMAIN}"
      # Where a meeting's join link points. Unset ⇒ every link comes back null, which looks like a
      # broken feature rather than a missing setting.
      Rooms__PublicBaseUrl: "https://${ROOM_DOMAIN}"
      # The media server: a dedicated LiveKit on its own machine (lk.myceo.ir), NOT this box. The
      # secret signs every join token and is not room-scoped — whoever holds it can mint a token for
      # any room on that server — so it lives only in deploy/.env. Empty ⇒ meetings report themselves
      # unavailable rather than minting tokens nothing will accept.
      LiveKit__ApiUrl: "${LIVEKIT_API_URL:-}"
      LiveKit__ApiKey: "${LIVEKIT_API_KEY:-}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET:-}"
      LiveKit__PublicWsUrl: "${LIVEKIT_PUBLIC_WS_URL:-}"
      # Election ballot crypto. BOTH must be set and MUST DIFFER, each base64 of 32 bytes
      # (openssl rand -base64 32). Without them voting reports itself unavailable rather than sealing
      # ballots under a default key — deliberate: an unusable election beats an unsafe one.
      Elections__VoterPepper: "${ELECTIONS_VOTER_PEPPER:-}"
      Elections__BallotMasterKey: "${ELECTIONS_BALLOT_MASTER_KEY:-}"
      # VMS. The gateway token is what the media VPS presents when it asks for the camera list; it
      # must equal the contents of /srv/vms/gateway.token on that machine. Empty ⇒ the route refuses
      # everybody, which is the safe direction for a half-configured deploy.
      Vms__GatewayToken: "${VMS_GATEWAY_TOKEN:-}"
      # Signs the short-lived cookie a browser shows the media gateway. Empty ⇒ /api/VmsMedia refuses
      # in BOTH directions, so no cookie is ever minted that the gateway would reject.
      VmsMedia__TokenSecret: "${VMS_MEDIA_TOKEN_SECRET:-}"
      # The parent domain, because the cookie is set by api.myceo.ir and has to be sent to
      # cam.myceo.ir. Host-only (the default) would leave every camera tile unauthorised.
      VmsMedia__CookieDomain: "${VMS_COOKIE_DOMAIN:-.myceo.ir}"
      # Bale bot — the second voting channel. Empty BotToken/WebhookPath makes the webhook 404, which is
      # the safe default. The webhook path is not a secret in the security sense (getWebhookInfo returns
      # it and it appears in proxy logs) but keeping it out of the repo still stops casual probing.
      Bale__BotToken: "${BALE_BOT_TOKEN:-}"
      Bale__WebhookPath: "${BALE_WEBHOOK_PATH:-}"
      Bale__WebhookSecret: "${BALE_WEBHOOK_SECRET:-}"
      # safir pushes the vote code to a Bale account BY PHONE NUMBER. Both are required together;
      # without them the Bale channel reports "not delivered" and SMS carries every code.
      Bale__SafirAccessKey: "${BALE_SAFIR_ACCESS_KEY:-}"
      Bale__SafirBotId: "${BALE_SAFIR_BOT_ID:-0}"
      # MunSanandaj: KurdNezam read-only SQL + mahyapardaz REST bearer token (empty = feature disabled).
      ConnectionStrings__KurdNezamDb: "${KURDNEZAM_DB_CONN:-}"
      MunSanandaj__ApiToken: "${MUN_SANANDAJ_API_TOKEN:-}"
      # Hours between automatic runs (the worker also fires once at every container start).
      MunSanandaj__IntervalHours: "${MUN_SANANDAJ_INTERVAL_HOURS:-2}"
      # Stopgap: the report-PDF host's certificate expired 21 Jul 2026 and port 80 there is
      # firewalled, so there is no http:// alternative. When this is "true" AND the pin below
      # matches, an EXPIRED certificate is accepted for that host — and nothing else is: any other
      # chain error, or a different public key, still fails. Set to "false" once it is renewed
      # (renewal changes the key, so the pin stops matching and downloads fail closed).
      MunSanandaj__AllowExpiredPdfCertificate: "${MUN_SANANDAJ_ALLOW_EXPIRED_PDF_CERT:-false}"
      MunSanandaj__PdfCertificatePublicKeyPin: "${MUN_SANANDAJ_PDF_CERT_PIN:-}"
      # Iran Kish gateway for the welfare module. Terminal/acceptor ids + the RSA PUBLIC key are
      # public values shipped in appsettings.json; only the pass phrase is a secret (deploy/.env).
      IranKish__PassPhrase: "${IRK_PASSPHRASE:-}"
      IranKish__CallbackUrl: "https://${API_DOMAIN}/api/walfare/payments/irk-return"
      Walfare__FrontBaseUrl: "https://${WALFARE_DOMAIN}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-api.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-api.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-api.service=ceoportal-api"
      - "traefik.http.services.ceoportal-api.loadbalancer.server.port=8080"
      # Keep existing mobile/browser builds working until they adopt api.myceo.ir.
      - "traefik.http.routers.ceoportal-api-legacy.rule=Host(`${LEGACY_API_DOMAIN:-api.mabhas19.myceo.ir}`)"
      - "traefik.http.routers.ceoportal-api-legacy.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-api-legacy.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-api-legacy.service=ceoportal-api"
    networks: [internal, traefik]

  mabhas19-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked at build time into the client bundle. Domains are unchanged from the old server.
        NEXT_PUBLIC_API_BASE: "https://${API_DOMAIN}"
        NEXT_PUBLIC_AUTH_ISSUER: "https://${AUTH_DOMAIN}"
    image: mabhas19-web:newserver
    container_name: mabhas19-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_BASE: "https://${API_DOMAIN}"
      # Auth.js (NextAuth v5) OIDC client -> central IdP. Server-side runtime values.
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "https://${WEB_DOMAIN}"
      AUTH_MABHAS19_ISSUER: "https://${AUTH_DOMAIN}"
      AUTH_MABHAS19_ID: "mabhas19-web"
      AUTH_MABHAS19_SECRET: ${MABHAS19_WEB_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.m19web.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.m19web.entrypoints=websecure"
      - "traefik.http.routers.m19web.tls.certresolver=myresolver"
      - "traefik.http.routers.m19web.service=m19web"
      - "traefik.http.services.m19web.loadbalancer.server.port=3000"
    # internal: egress + DNS so Auth.js server-side calls reach the IdP (auth.myceo.ir).
    networks: [traefik, internal]

  portal-web:
    build:
      context: ..
      dockerfile: portal-web/deploy/Dockerfile.portal-web
    image: ceo-portal-portal-web:newserver
    container_name: ceo-portal-portal-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-portal.rule=Host(`${PORTAL_DOMAIN:-myceo.ir}`)"
      - "traefik.http.routers.ceoportal-portal.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-portal.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-portal.service=ceoportal-portal"
      - "traefik.http.services.ceoportal-portal.loadbalancer.server.port=80"
    networks: [traefik]

  # analytics-web — the React/Vite analytics SPA (analytic.myceo.ir), served static by nginx.
  analytics-web:
    build:
      context: ..
      dockerfile: analytics-web/deploy/Dockerfile.analytics-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_AUTHORITY: "https://${AUTH_DOMAIN}"
        VITE_AUTH_MODE: "oidc"
        VITE_AUTH_CLIENT_ID: "analytics-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
        VITE_USE_MOCK_API: "false"
        # Set ANALYTICS_AI_FE_MODE=mock in .env to ship Ask-AI on the mock until the live gateway is trusted.
        VITE_AI_MODE: "${ANALYTICS_AI_FE_MODE:-gateway}"
    image: ceo-portal-analytics-web:newserver
    container_name: ceo-portal-analytics-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-analytics.rule=Host(`${ANALYTICS_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-analytics.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-analytics.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-analytics.service=ceoportal-analytics"
      - "traefik.http.services.ceoportal-analytics.loadbalancer.server.port=80"
    # Static SPA: all OIDC/API calls run in the browser -> no DB/IdP server-side egress needed.
    networks: [traefik]

  # mun-sanandaj-web — the React/Vite monitoring SPA (mun-sanandaj.myceo.ir), served static by nginx.
  mun-sanandaj-web:
    build:
      context: ..
      dockerfile: mun-sanandaj-web/deploy/Dockerfile.mun-sanandaj-web
      args:
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_AUTHORITY: "https://${AUTH_DOMAIN}"
        VITE_AUTH_CLIENT_ID: "mun-sanandaj-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-mun-sanandaj-web:newserver
    container_name: ceo-portal-mun-sanandaj-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-mun-sanandaj.rule=Host(`${MUN_SANANDAJ_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-mun-sanandaj.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-mun-sanandaj.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-mun-sanandaj.service=ceoportal-mun-sanandaj"
      - "traefik.http.services.ceoportal-mun-sanandaj.loadbalancer.server.port=80"
    networks: [traefik]

  # landing-panel — the kurdnezam CMS admin panel (landing-panel.myceo.ir). React/Vite + Ant Design
  # SPA served static by nginx. Reads/writes the /api/kurdnezam/* endpoints; every write is gated on
  # the Administrator role, enforced by the API (the SPA only hides what it cannot do).
  landing-panel:
    build:
      context: ..
      dockerfile: landing-panel/deploy/Dockerfile.landing-panel
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_ISSUER: "https://${AUTH_DOMAIN}"
        VITE_OIDC_CLIENT_ID: "landing-panel"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-landing-panel:newserver
    container_name: ceo-portal-landing-panel
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-landing-panel.rule=Host(`${LANDING_PANEL_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-landing-panel.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-landing-panel.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-landing-panel.service=ceoportal-landing-panel"
      - "traefik.http.services.ceoportal-landing-panel.loadbalancer.server.port=80"
    # Static SPA: all OIDC/API calls run in the browser -> no server-side egress needed.
    networks: [traefik]

  # kurdnezam-web — the PUBLIC landing site (kurdnezam.ir + kurdnezam.myceo.ir). Next.js standalone.
  # Moved in from its own repo/stack so the whole platform builds and deploys from one place.
  # Unlike the SPAs above this one renders on the server, so it needs egress to reach the API.
  kurdnezam-web:
    build:
      # Self-contained app (its own package.json + lock, not an npm workspace member), so its own
      # folder is the build context and its Dockerfile is used unchanged.
      context: ../kurdnezam-web
      dockerfile: Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at BUILD time. Public value only, never a secret.
        NEXT_PUBLIC_API_BASE: "https://${API_DOMAIN}"
    image: ceo-portal-kurdnezam-web:newserver
    container_name: ceo-portal-kurdnezam-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # TWO routers on purpose, because the two hostnames reach us by different paths.
      #
      # 1) The root domain now points STRAIGHT at this box, so it can get a real Let's Encrypt
      #    cert via HTTP-01. It must NOT use myresolver (DNS-01): the ArvanCloud token is 403
      #    "access restricted" for these zones, and kurdnezam.ir is not in that account at all
      #    (404 "Domain not found") — it runs on its own ns1/ns2.kurdnezam.ir nameservers.
      - "traefik.http.routers.ceoportal-kurdnezam.rule=Host(`${KURDNEZAM_ROOT_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-kurdnezam.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-kurdnezam.tls.certresolver=httpresolver"
      - "traefik.http.routers.ceoportal-kurdnezam.service=ceoportal-kurdnezam"
      # 2) The myceo.ir hostname still sits behind the ArvanCloud CDN, which terminates TLS
      #    itself. It requests NO cert here: an HTTP-01 challenge for it would be answered by the
      #    CDN rather than by us, and bundling it with the root domain would fail BOTH.
      - "traefik.http.routers.ceoportal-kurdnezam-cdn.rule=Host(`${KURDNEZAM_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-kurdnezam-cdn.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-kurdnezam-cdn.tls=true"
      - "traefik.http.routers.ceoportal-kurdnezam-cdn.service=ceoportal-kurdnezam"
      - "traefik.http.services.ceoportal-kurdnezam.loadbalancer.server.port=3000"
    # node:22-alpine has busybox wget (no curl). Hitting / renders a real page, so this proves
    # Next is actually serving, not just that the process is alive.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    networks: [traefik]

  # walfare-web — the engineers' welfare dashboard (سامانه رفاهی مهندسین) at refahi.kurdnezam.ir.
  # React/Vite + AntD served static by nginx; signs in via the walfare-web OIDC client (the کد ملی
  # + OTP page on the IdP) and calls /api/walfare on the API from the browser.
  walfare-web:
    build:
      context: ..
      dockerfile: walfare-web/deploy/Dockerfile.walfare-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_ISSUER: "https://${AUTH_DOMAIN}"
        VITE_OIDC_CLIENT_ID: "walfare-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-walfare-web:newserver
    container_name: ceo-portal-walfare-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-walfare.rule=Host(`${WALFARE_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-walfare.entrypoints=websecure"
      # refahi.kurdnezam.ir points straight at this box (no CDN), so HTTP-01 issues a real cert —
      # myresolver (ArvanCloud DNS-01) is broken for these zones and must not be used here.
      - "traefik.http.routers.ceoportal-walfare.tls.certresolver=httpresolver"
      - "traefik.http.routers.ceoportal-walfare.service=ceoportal-walfare"
      - "traefik.http.services.ceoportal-walfare.loadbalancer.server.port=80"
    networks: [traefik]

  # election-web — سامانه انتخابات (election.myceo.ir). React/Vite + Ant Design SPA served static by
  # nginx. ONE app, TWO audiences: engineers vote at "/" behind RequireAuth only, and administrators
  # manage elections at "/admin*" behind RequireAdmin. The API enforces both again — this SPA only
  # decides what to draw.
  #
  # Voters sign in with کد ملی + یک‌بار‌مصرف: the IdP routes this client's unauthenticated authorize to
  # /Account/EngineerLogin because engineer accounts have no password.
  election-web:
    build:
      context: ..
      dockerfile: election-web/deploy/Dockerfile.election-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_AUTHORITY: "https://${AUTH_DOMAIN}"
        VITE_AUTH_CLIENT_ID: "election-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-election-web:newserver
    container_name: ceo-portal-election-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-election.rule=Host(`${ELECTION_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-election.entrypoints=websecure"
      # election.myceo.ir sits under myceo.ir, which is behind the ArvanCloud CDN — so this uses
      # myresolver (DNS-01), the same as every other myceo.ir host. NOT httpresolver: HTTP-01 cannot
      # complete through the CDN. (refahi.kurdnezam.ir points straight at the box and is the exception.)
      - "traefik.http.routers.ceoportal-election.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-election.service=ceoportal-election"
      - "traefik.http.services.ceoportal-election.loadbalancer.server.port=80"
    networks: [traefik]

  # room-web — جلسات آنلاین (room.myceo.ir). React/Vite + Ant Design, served static by nginx.
  # Its media never touches this box: video goes browser <-> lk.myceo.ir (a dedicated LiveKit on its
  # own machine). Only tokens and admin calls pass through the API here.
  room-web:
    build:
      context: ..
      dockerfile: room-web/deploy/Dockerfile.room-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_AUTHORITY: "https://${AUTH_DOMAIN}"
        VITE_AUTH_CLIENT_ID: "room-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-room-web:newserver
    container_name: ceo-portal-room-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-room.rule=Host(`${ROOM_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-room.entrypoints=websecure"
      # Same reasoning as election: room.myceo.ir sits under myceo.ir, so myresolver (DNS-01).
      # HTTP-01 cannot complete through the CDN even when the record is currently unproxied.
      - "traefik.http.routers.ceoportal-room.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-room.service=ceoportal-room"
      - "traefik.http.services.ceoportal-room.loadbalancer.server.port=80"
    networks: [traefik]

  # vms-web — دوربین‌های نظارتی (vms.myceo.ir). React/Vite + Ant Design, served static by nginx.
  # Administrator-only on every route, including the camera wall — there is no lighter audience.
  # Video never touches this box: the browser talks to cam.myceo.ir (go2rtc on the same machine that
  # runs LiveKit), and Traefik there calls this API's /api/VmsMedia/check before letting it through.
  vms-web:
    build:
      context: ..
      dockerfile: vms-web/deploy/Dockerfile.vms-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        VITE_API_BASE: "https://${API_DOMAIN}"
        VITE_AUTH_AUTHORITY: "https://${AUTH_DOMAIN}"
        VITE_AUTH_CLIENT_ID: "vms-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
        # The media gateway, NOT this API. Wrong or missing and every tile fails to connect with
        # nothing on screen to explain it.
        VITE_MEDIA_BASE: "https://${VMS_CAM_DOMAIN:-cam.myceo.ir}"
    image: ceo-portal-vms-web:newserver
    container_name: ceo-portal-vms-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-vms.rule=Host(`${VMS_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-vms.entrypoints=websecure"
      # myresolver (DNS-01), like every myceo.ir host: HTTP-01 cannot complete through the CDN.
      # Note that issuance is currently failing box-wide (the ArvanCloud DNS token is refused) — the
      # CDN terminates public TLS, so this host serves exactly like its neighbours until that is
      # fixed. See GOTCHAS.
      - "traefik.http.routers.ceoportal-vms.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-vms.service=ceoportal-vms"
      - "traefik.http.services.ceoportal-vms.loadbalancer.server.port=80"
    networks: [traefik]

  # admin-web — the central user-management SPA (admin.myceo.ir). React/Vite + Ant Design, served
  # static by nginx. It calls the IdP's api/admin/* endpoints from the browser (base = the AUTH host,
  # not the API host), so its access token needs the Administrator role — enforced by the IdP.
  admin-web:
    build:
      context: ..
      dockerfile: admin-web/deploy/Dockerfile.admin-web
      args:
        # Baked into the static bundle at build time (PUBLIC values only — never secrets).
        # The admin API is hosted by the IdP itself, so the app base is the AUTH host.
        VITE_AUTH_ISSUER: "https://${AUTH_DOMAIN}"
        VITE_OIDC_CLIENT_ID: "admin-web"
        VITE_AUTH_SCOPE: "openid profile email roles ceo.api"
    image: ceo-portal-admin-web:newserver
    container_name: ceo-portal-admin-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-admin.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-admin.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-admin.service=ceoportal-admin"
      - "traefik.http.services.ceoportal-admin.loadbalancer.server.port=80"
    # Static SPA: all OIDC/API calls run in the browser -> no server-side egress needed.
    networks: [traefik]

  # status — internal dev roadmap/status board (status.myceo.ir). Pure-static nginx (no build
  # step), serving roadmap/. It exposes the internal roadmap, so it is gated by a Traefik
  # basic-auth middleware whose credentials (${STATUS_BASICAUTH} = "user:apr1hash") are generated
  # once by scripts/remote-provision.sh and printed to the deploy log. Keep CDN = proxied (orange)
  # + SSL Full so ArvanCloud terminates public TLS (origin serves Traefik's self-signed cert).
  status:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.status
    image: ceo-portal-status:newserver
    container_name: ceo-portal-status
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.ceoportal-status.rule=Host(`${STATUS_DOMAIN}`)"
      - "traefik.http.routers.ceoportal-status.entrypoints=websecure"
      - "traefik.http.routers.ceoportal-status.tls.certresolver=myresolver"
      - "traefik.http.routers.ceoportal-status.service=ceoportal-status"
      - "traefik.http.routers.ceoportal-status.middlewares=ceoportal-status-auth"
      - "traefik.http.middlewares.ceoportal-status-auth.basicauth.users=${STATUS_BASICAUTH}"
      - "traefik.http.services.ceoportal-status.loadbalancer.server.port=80"
    networks: [traefik]

volumes:
  mssqldata:
    name: ceo-portal_mssqldata
    external: true
  miniodata:
    name: ceo-portal_miniodata
    external: true

networks:
  traefik:
    external: true
  internal:
    driver: bridge
