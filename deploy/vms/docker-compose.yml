# go2rtc behind the VPS's existing Traefik, at cam.myceo.ir.
#
# A container rather than the host service it started as, for one reason: this Traefik runs with the
# **docker provider only**. Routing to a process on the host would mean adding a file provider to
# /srv/sites/reverse-proxy/traefik.yml and restarting Traefik — which also fronts lk.myceo.ir, gitea,
# metabase and minio. Labels need no restart at all.
#
# Nothing is published. The only way in is Traefik, and Traefik asks our API first.

services:
  go2rtc:
    image: vms-go2rtc:1.9.14
    container_name: vms-go2rtc
    restart: unless-stopped

    # Generated by vms-sync from the camera list in CeoDb. Read-only: go2rtc can rewrite its own
    # config through its API, and the config holds every camera password.
    # NOT /srv/vms. Docker here is Docker Desktop, which bind-mounts only host paths on its sharing
    # list — anything else mounts as an EMPTY DIRECTORY with no error, and go2rtc then starts on its
    # defaults with no cameras. The docker user's home is shared; /srv is not.
    volumes:
      - /home/amirserver/vms-config/go2rtc.yaml:/config/go2rtc.yaml:ro
    command: ["-c", "/config/go2rtc.yaml"]

    # nobody. Numeric because the image is `scratch` and has no /etc/passwd to resolve a name
    # against. Not root: the process holds every camera password in memory and talks to devices on
    # the public internet.
    user: "65534:65534"

    networks: [traefik]

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.vms-cam.rule=Host(`cam.myceo.ir`)"
      - traefik.http.routers.vms-cam.entrypoints=websecure
      - traefik.http.routers.vms-cam.tls=true
      # tlsChallenge, like lk.myceo.ir. cam.myceo.ir must therefore be a GREY record at the DNS
      # provider — TLS-ALPN cannot complete through the CDN. See the design, §6.
      - traefik.http.routers.vms-cam.tls.certresolver=myresolver
      - traefik.http.services.vms-cam.loadbalancer.server.port=1984

      - traefik.http.routers.vms-cam.middlewares=vms-auth@docker

      # The gate. Traefik asks our API about every stream request and forwards the viewer's own
      # headers, so the browser's cookie is what gets judged. Any non-2xx means refuse.
      - traefik.http.middlewares.vms-auth.forwardauth.address=https://api.myceo.ir/api/VmsMedia/check
      # Off. The API must not believe an X-Forwarded-Host it cannot verify.
      - traefik.http.middlewares.vms-auth.forwardauth.trustForwardHeader=false

networks:
  traefik:
    external: true
