# go2rtc, the half this machine owns. vms-sync appends the streams block from the API.
#
# Nothing here names a camera or a credential: cameras come from CeoDb, credentials from
# credentials.env next to this file. Editing this file is how you change how go2rtc listens.

api:
  # Localhost only. Traefik on this machine terminates TLS for cam.myceo.ir and will call our API's
  # forwardAuth before anything reaches here (step 5). Until then, nothing outside can talk to it.
  #
  # This matters more than it looks: go2rtc's /api/streams echoes each source URL back, credentials
  # included. An exposed API is an exposed camera password.
  listen: "127.0.0.1:1984"

rtsp:
  # go2rtc's own RTSP server. Not needed by browsers and not published; left off so there is one
  # fewer listener holding camera streams.
  listen: ""

webrtc:
  # WebRTC is ruled out: the cameras are H.265 and Chrome will not carry HEVC over WebRTC. Browsers
  # get MSE over the existing 443, which is also why no UDP port had to be opened. See the design §3.1.
  listen: ""

log:
  level: info
