# go2rtc, the half this machine owns. vms-sync appends the streams block from the API.
#
# Nothing here names a camera or a credential: cameras come from CeoDb, credentials from
# credentials.env next to this file. Editing this file is how you change how go2rtc listens.

api:
  # All interfaces — but inside a container that publishes no ports, so the only route in is Traefik,
  # which calls our API's forwardAuth first. Binding to loopback here would mean loopback *of the
  # container*, which Traefik cannot reach.
  #
  # This matters more than it looks: go2rtc's /api/streams echoes each source URL back, credentials
  # included. Whatever can reach this port can read every camera password.
  listen: ":1984"

  # The player is served from vms.myceo.ir and the stream from cam.myceo.ir, so every MSE WebSocket
  # arrives with an Origin that is not this host. go2rtc's default Upgrader.CheckOrigin rejects that
  # outright — "websocket: request origin not allowed" — and the tile stays black with no clue why.
  #
  # "*" is go2rtc's only setting here; there is no allow-list. It is acceptable because it is not
  # what protects this port: Traefik routes exactly one path in and calls the API's forwardAuth
  # first, and the media cookie is scoped to .myceo.ir with SameSite=Lax — so a genuinely
  # third-party page cannot send it, and its upgrade is rejected before go2rtc is reached.
  origin: "*"

rtsp:
  # go2rtc's own RTSP server. Not needed by browsers and not published; left off so there is one
  # fewer listener holding camera streams.
  listen: ""

webrtc:
  # WebRTC is ruled out: the cameras are H.265 and Chrome will not carry HEVC over WebRTC. Browsers
  # get MSE over the existing 443, which is also why no UDP port had to be opened. See the design §3.1.
  listen: ""

log:
  level: info
